<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Simulação da caixa do WhatsApp</title>
    <style>
      body { font: 15px/1.4 system-ui, sans-serif; margin: 0; background: #efeae2; }
      header { background: #f0f2f5; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      #side { position: fixed; left: 0; top: 56px; width: 220px; bottom: 0; background: #fff; padding: 12px; }
      #main, .conversa { margin-left: 244px; padding: 16px; }
      footer { background: #f0f2f5; padding: 10px; border-radius: 8px; display: flex; gap: 8px; align-items: flex-end; }
      [contenteditable] { flex: 1; min-height: 22px; max-height: 120px; overflow: auto; background: #fff; border-radius: 8px; padding: 9px 12px; outline: none; white-space: pre-wrap; }
      #enviadas { margin-top: 12px; }
      .msg { background: #d9fdd3; padding: 8px; border-radius: 8px; margin: 4px 0; white-space: pre-wrap; }
      button { font: inherit; }
      #log { font-family: monospace; font-size: 12px; white-space: pre-wrap; }
      /* a prévia cobre a conversa inteira, como a do WhatsApp */
      #previa { position: fixed; left: 244px; right: 0; top: 56px; bottom: 0; background: #fff; padding: 24px; display: flex; flex-direction: column; gap: 12px; z-index: 5; }
      #previa[hidden] { display: none; }
      #recusa { position: fixed; left: 0; right: 0; top: 0; bottom: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; gap: 12px; z-index: 6; color: #fff; }
      #recusa[hidden] { display: none; }
    </style>
  </head>
  <body>
    <header>
      <strong>Simulação local</strong>
      <label><input type="radio" name="modo" value="lexical" checked /> Editor com colar (como o WhatsApp)</label>
      <label><input type="radio" name="modo" value="simples" /> Caixa simples</label>
      <label><input type="radio" name="modo" value="sem-conversa" /> Sem conversa aberta</label>
      <label><input type="radio" name="modo" value="layout" /> Layout mudou</label>
      <span>Anexo:</span>
      <label><input type="radio" name="anexo" value="colar" checked /> Abre ao colar</label>
      <label><input type="radio" name="anexo" value="arrastar" /> Só ao soltar</label>
      <label><input type="radio" name="anexo" value="nenhum" /> Não abre</label>
      <label><input type="radio" name="anexo" value="recusa" /> Recusa o arquivo</label>
    </header>
    <div id="side">
      <div contenteditable="true" role="textbox" data-tab="3" aria-label="Pesquisar">busca de conversas</div>
    </div>
    <div id="main" class="conversa">
      <div data-marcon-caixa>
        <footer>
          <div id="caixa" contenteditable="true" role="textbox" data-tab="10" aria-label="Digite uma mensagem"></div>
          <button id="enviar" type="button">Enviar</button>
        </footer>
      </div>
      <p>
        <button id="inserir" type="button">Inserir texto de exemplo</button>
        <button id="inserir-var" type="button">Inserir variação</button>
        <button id="anexar" type="button">Anexar PDF de exemplo</button>
      </p>
      <div id="recusa" hidden role="dialog"><p>1 arquivo que você tentou adicionar não é compatível.</p><button id="recusa-ok" type="button">OK</button></div>
      <div id="previa" hidden>
        <strong>Prévia de anexo</strong>
        <span id="previa-nome"></span>
        <div contenteditable="true" aria-label="Legenda">legenda</div>
        <button id="previa-enviar" type="button">Enviar</button>
        <button id="previa-fechar" type="button">Fechar</button>
      </div>
      <div id="enviadas"></div>
      <div id="log"></div>
    </div>
    <script src="simulacao.js"></script>
  </body>
</html>
